<script>
// === FIX V10 - STABLE MATRIX - no jump 28->227 ===
window.__nativeAz = null;
window.__smoothAz = null;
window.onNativeAzimuth = function(az){
  // az من Java - ثابت من getRotationMatrix
  window.__nativeAz = (az+360)%360;
  // smooth 15%
  if(window.__smoothAz===null) window.__smoothAz=window.__nativeAz;
  var diff=window.__nativeAz - window.__smoothAz;
  if(diff>180) diff-=360;
  if(diff<-180) diff+=360;
  window.__smoothAz = (window.__smoothAz + diff*0.15 + 360)%360;
  // ارسل ل React عبر custom event
  try{ window.dispatchEvent(new CustomEvent('native-azimuth', {detail: window.__smoothAz})); }catch(e){}
};
// استقبال من parent عبر postMessage (للـ iframe blob)
window.addEventListener('message', function(e){
  try{
    if(e.data && e.data.type==='native-azimuth'){
      window.onNativeAzimuth(e.data.az);
    }
  }catch(err){}
});
// override DeviceOrientation لتثبيت 134° اذا في native
(function(){
  var origAdd = window.addEventListener;
  window.addEventListener = function(type, listener, opts){
    if(type==='deviceorientation' || type==='deviceorientationabsolute'){
      var wrapped=function(ev){
        if(window.__smoothAz!==null){
          // حقن heading ثابت
          Object.defineProperty(ev, 'webkitCompassHeading', {value: window.__smoothAz, writable:false});
          ev.alpha = (360 - window.__smoothAz) % 360;
        }
        return listener(ev);
      };
      return origAdd.call(this, type, wrapped, opts);
    }
    return origAdd.call(this, type, listener, opts);
  };
})();
console.log('✅ STABLE MATRIX FIX loaded - waiting for Java azimuth');
</script>

<div id="qb-overlay"></div>
<div id="qb-sheet">
  <div id="qb-handle"></div>
  <div id="qb-head"><h3>بحث مدينة</h3><div id="qb-close">✕</div></div>
  <div id="qb-search"><div id="qb-input-wrap"><input id="qb-input" placeholder="اكتب اسم المدينة..." autocomplete="off"/><div id="qb-input-icon">🔍</div></div></div>
  <div id="qb-body"><div id="qb-list"></div></div>
</div>
<script id="qb-script">
(function(){
  var Kaaba={lat:21.4225,lon:39.8262};
  function qiblaCalc(lat,lon){
    var toRad=Math.PI/180;
    var phi1=lat*toRad, lambda1=lon*toRad;
    var phi2=Kaaba.lat*toRad, lambda2=Kaaba.lon*toRad;
    var dLambda=lambda2-lambda1;
    var y=Math.sin(dLambda)*Math.cos(phi2);
    var x=Math.cos(phi1)*Math.sin(phi2)-Math.sin(phi1)*Math.cos(phi2)*Math.cos(dLambda);
    var brng=(Math.atan2(y,x)*180/Math.PI+360)%360;
    var dLat=phi2-phi1, dLon=lambda2-lambda1;
    var a=Math.sin(dLat/2)**2+Math.cos(phi1)*Math.cos(phi2)*Math.sin(dLon/2)**2;
    var dist=6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    return {bearing:brng,distance:dist};
  }
  function getCities(){try{return JSON.parse(localStorage.getItem('qibla_cities')||'[]')}catch(e){return []}}
  var overlay=document.getElementById('qb-overlay');
  var sheet=document.getElementById('qb-sheet');
  var input=document.getElementById('qb-input');
  var list=document.getElementById('qb-list');
  var closeBtn=document.getElementById('qb-close');
  var timer=null;

  function openSheet(){overlay.classList.add('show');sheet.classList.add('show');setTimeout(function(){input.focus();},350);renderRecents();}
  function closeSheet(){overlay.classList.remove('show');sheet.classList.remove('show');input.value='';}
  overlay.addEventListener('click',closeSheet);
  closeBtn.addEventListener('click',closeSheet);
  document.addEventListener('keydown',function(e){if(e.key==='Escape') closeSheet();});

  function renderRecents(){
    var cities=getCities();
    if(!cities.length){
      list.innerHTML='<div class="qb-empty"><span>🌍</span>اكتب اسم المدينة للبحث<br><div style="font-size:11px;opacity:.5;margin-top:6px">مثلاً: طرابلس، بيروت، إسطنبول، القاهرة</div></div>';
      return;
    }
    var h='<div class="qb-section">مدن سابقة • '+cities.length+'</div>';
    cities.forEach(function(c){
      var name=c.name||'مدينة';
      var bd=c.bearing!=null?c.bearing.toFixed(1)+'°':'—';
      var dist=c.distance!=null?Math.round(c.distance)+'كم':(c.distanceKm!=null?Math.round(c.distanceKm)+'كم':'—');
      var coord=c.lat?c.lat.toFixed(2)+' , '+c.lon.toFixed(2):'';
      h+='<div class="qb-item" data-lat="'+c.lat+'" data-lon="'+c.lon+'" data-name="'+name.replace(/"/g,'&quot;')+'"><div class="qb-item-left"><div class="qb-name">'+name+'</div><div class="qb-sub">'+coord+'</div></div><div class="qb-right"><span class="qb-badge">'+bd+'</span><span class="qb-badge dist">'+dist+'</span></div></div>';
    });
    list.innerHTML=h;
    bindClicks();
  }

  function bindClicks(){
    document.querySelectorAll('.qb-item').forEach(function(el){
      el.addEventListener('click',function(){
        var lat=parseFloat(el.getAttribute('data-lat'));
        var lon=parseFloat(el.getAttribute('data-lon'));
        var name=el.getAttribute('data-name');
        if(!isNaN(lat)) selectCity(lat,lon,name);
      });
    });
  }

  function selectCity(lat,lon,name){
    var q=getCities();
    var calc=qiblaCalc(lat,lon);
    var newEntry={name:name,lat:lat,lon:lon,bearing:calc.bearing,distance:calc.distance};
    var filtered=q.filter(function(c){return c.name!==name});
    filtered.unshift(newEntry);
    localStorage.setItem('qibla_cities',JSON.stringify(filtered.slice(0,20)));
    localStorage.setItem('qibla_last_loc',JSON.stringify({lat:lat,lon:lon,accuracy:50,city:name}));
    closeSheet();
    // reload to apply - original app reads last_loc on mount
    setTimeout(function(){location.reload();},180);
  }

  input.addEventListener('input',function(){
    var q=input.value.trim();
    if(timer) clearTimeout(timer);
    if(!q){renderRecents();return;}
    list.innerHTML='<div class="qb-load">جاري البحث</div>';
    timer=setTimeout(function(){
      fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(q)+'&format=json&limit=5&accept-language=ar')
      .then(function(r){return r.json()})
      .then(function(data){
        if(!data.length){list.innerHTML='<div class="qb-empty"><span>🔍</span>لم يتم العثور على "'+q+'"<br><div style="font-size:11px;opacity:.5">جرب كتابة الاسم بالإنجليزية</div></div>';return;}
        var html='<div class="qb-section">نتائج البحث • '+data.length+'</div>';
        data.forEach(function(it){
          var lat=parseFloat(it.lat), lon=parseFloat(it.lon);
          var calc=qiblaCalc(lat,lon);
          var shortName=it.display_name.split(',')[0];
          var full=it.display_name;
          html+='<div class="qb-item" data-lat="'+lat+'" data-lon="'+lon+'" data-name="'+shortName.replace(/"/g,'&quot;')+'"><div class="qb-item-left"><div class="qb-name">'+shortName+'</div><div class="qb-sub">'+full.substring(0,80)+'</div></div><div class="qb-right"><span class="qb-badge">'+calc.bearing.toFixed(1)+'°</span><span class="qb-badge dist">'+Math.round(calc.distance)+'كم</span></div></div>';
        });
        list.innerHTML=html;
        bindClicks();
      }).catch(function(){list.innerHTML='<div class="qb-empty">تعذر الاتصال بالخادم</div>';});
    },380);
  });

  function hijackButton(){
    var btns=document.querySelectorAll('button');
    btns.forEach(function(b){
      if(b.textContent && b.textContent.indexOf('بحث مدينة')!==-1 && !b.dataset.qbHijacked){
        b.dataset.qbHijacked='1';
        var nb=b.cloneNode(true);
        b.parentNode.replaceChild(nb,b);
        nb.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openSheet();});
      }
    });
  }
  setInterval(hijackButton,600);
  var mo=new MutationObserver(hijackButton);
  mo.observe(document.body,{childList:true,subtree:true});
  hijackButton();
})();
</script>

<script id="qb-reverse-geocode">
(function(){
  // Fixed: no reload loop, single fetch, event based
  var origSetItem = localStorage.setItem;
  var _fetching = false;
  localStorage.setItem = function(key, value){
    origSetItem.apply(this, arguments);
    if(key === 'qibla_last_loc'){
      try{
        var loc = JSON.parse(value);
        if(loc && loc.lat && loc.lon && !loc.city && !_fetching){
          _fetching = true;
          fetch('https://nominatim.openstreetmap.org/reverse?lat='+loc.lat+'&lon='+loc.lon+'&format=json&accept-language=ar&zoom=10')
            .then(function(r){return r.json()})
            .then(function(data){
              if(data && data.display_name){
                var city = (data.address && (data.address.village || data.address.town || data.address.city || data.address.municipality)) || data.display_name.split(',')[0];
                var updated = {lat: loc.lat, lon: loc.lon, accuracy: loc.accuracy, city: city};
                origSetItem.call(localStorage, 'qibla_last_loc', JSON.stringify(updated));
                try{ window.dispatchEvent(new CustomEvent('qibla-city-found', {detail: updated})); }catch(e){}
              }
            }).catch(function(){}).finally(function(){ setTimeout(function(){ _fetching=false; }, 2000); });
        }
        // If city search (has city and accuracy 50), remove accuracy display by setting accuracy to 50 (pill logic will hide it)
        // Already handled by pill logic
      }catch(e){}
    }
  };
})();
</script>
