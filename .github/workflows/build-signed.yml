name: build-qibla-apk-aab
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Find icon kibla.png first!
        run: |
          ICON=$(ls kibla.png khira.png icon.png 2>/dev/null | head -1)
          echo "ICON_FILE=$ICON" >> $GITHUB_ENV
          echo "Using icon: $ICON"

      - run: npm install

      - name: Prepare www
        run: |
          mkdir -p www
          [ -d dist ] && cp -r dist/* www/ || true
          cp index.html www/index.html
          ls -lh www/

      - run: npx cap add android || true
      - run: npx cap sync android

      - name: FIX Duplicate + Inject Qibla Permissions
        run: |
          echo "Fixing duplicate icon..."
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/mipmap-*/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_round.xml
          for d in android/app/src/main/res/mipmap-*; do
            [ -d "$d" ] && cp "$ICON_FILE" "$d/ic_launcher.png" && cp "$ICON_FILE" "$d/ic_launcher_round.png" && echo "Fixed $d with $ICON_FILE"
          done
          
          echo "Injecting Qibla permissions: LOCATION + INTERNET + COMPASS"
          python3 << 'PY'
          import pathlib
          mf=pathlib.Path("android/app/src/main/AndroidManifest.xml")
          txt=mf.read_text()
          perms="""
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.hardware.sensor.compass" android:required="true" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
          """
          if "ACCESS_FINE_LOCATION" not in txt:
              txt=txt.replace("<application", perms+"\n    <application")
              mf.write_text(txt)
              print("Permissions injected: LOCATION + INTERNET + COMPASS")
          PY

      - name: Keystore Fadel03906563 + Signing Release
        run: |
          python3 << 'PY'
          import pathlib
          p=pathlib.Path("android/app/build.gradle")
          s=p.read_text()
          if "keystoreProperties" not in s:
              s=s.replace("android {", "def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file('app/key.properties')\nif (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }\n\nandroid {")
          if "signingConfigs" not in s:
              s=s.replace("buildTypes {", "signingConfigs { release { if (keystorePropertiesFile.exists()) { storeFile file(keystoreProperties['storeFile']); storePassword keystoreProperties['storePassword']; keyAlias keystoreProperties['keyAlias']; keyPassword keystoreProperties['keyPassword'] } } }\n    buildTypes {")
          if "signingConfig signingConfigs.release" not in s:
              s=s.replace("buildTypes {\n        release {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release")
          p.write_text(s)
          PY
          keytool -genkeypair -keystore android/app/mykey.jks -storepass Fadel03906563 -keypass Fadel03906563 -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Khira Qibla, L=Tripoli, C=LB"
          echo "storeFile=mykey.jks" > android/app/key.properties
          echo "storePassword=Fadel03906563" >> android/app/key.properties
          echo "keyAlias=mykey" >> android/app/key.properties
          echo "keyPassword=Fadel03906563" >> android/app/key.properties

      - name: Build APK + AAB Release Signed
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew clean assembleRelease bundleRelease
          ls -lh app/build/outputs/apk/release/ app/build/outputs/bundle/release/

      - uses: actions/upload-artifact@v4
        with:
          name: Khira-Qibla-APK-AAB-kibla.png-RELEASE
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
