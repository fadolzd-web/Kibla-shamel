name: build-qibla-apk-aab
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Find kibla.png 75KB
        run: |
          ICON=$(ls kibla.png khira.png icon.png 2>/dev/null | head -1)
          echo "ICON_FILE=$ICON" >> $GITHUB_ENV
          echo "Using $ICON - size $(du -h $ICON)"

      - run: npm install
      - run: |
          mkdir -p www
          cp index.html www/index.html
      - run: npx cap add android || true
      - run: npx cap sync android

      - name: FIX - Resize 75KB icon to correct mipmap sizes
        run: |
          pip install Pillow
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/mipmap-*/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_round.xml
          
          python3 << 'PY'
          from PIL import Image
          import os
          icon = os.environ['ICON_FILE']
          print(f"Original: {icon}")
          im = Image.open(icon).convert("RGBA")
          print(f"Original size: {im.size}")
          
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              path = f"android/app/src/main/res/{folder}"
              os.makedirs(path, exist_ok=True)
              r = im.resize((size, size), Image.LANCZOS)
              r.save(f"{path}/ic_launcher.png", "PNG", optimize=True)
              r.save(f"{path}/ic_launcher_round.png", "PNG", optimize=True)
              print(f"{folder} -> {size}x{size} OK")
          PY

      - name: Permissions Qibla + Keystore Fadel03906563
        run: |
          python3 << 'PY'
          import pathlib
          mf=pathlib.Path("android/app/src/main/AndroidManifest.xml")
          txt=mf.read_text()
          if "ACCESS_FINE_LOCATION" not in txt:
              perms="""
                  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                  <uses-feature android:name="android.hardware.sensor.compass" android:required="true" />
              """
              txt=txt.replace("<application", perms+"\n    <application")
              mf.write_text(txt)
          PY
          python3 << 'PY'
          import pathlib
          p=pathlib.Path("android/app/build.gradle")
          s=p.read_text()
          if "keystoreProperties" not in s:
              s=s.replace("android {", "def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file('app/key.properties')\nif (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }\n\nandroid {")
          if "signingConfigs" not in s:
              s=s.replace("buildTypes {", "signingConfigs { release { if (keystorePropertiesFile.exists()) { storeFile file(keystoreProperties['storeFile']); storePassword keystoreProperties['storePassword']; keyAlias keystoreProperties['keyAlias']; keyPassword keystoreProperties['keyPassword'] } } }\n    buildTypes {")
          if "signingConfig signingConfigs.release" not in s:
              s=s.replace("buildTypes {\n        release {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release")
          p.write_text(s)
          PY
          keytool -genkeypair -keystore android/app/mykey.jks -storepass Fadel03906563 -keypass Fadel03906563 -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Khira Qibla, L=Tripoli, C=LB"
          echo "storeFile=mykey.jks" > android/app/key.properties
          echo "storePassword=Fadel03906563" >> android/app/key.properties
          echo "keyAlias=mykey" >> android/app/key.properties
          echo "keyPassword=Fadel03906563" >> android/app/key.properties

      - name: Build APK + AAB
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew clean assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Qibla-APK-AAB-75KB-FIXED
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
